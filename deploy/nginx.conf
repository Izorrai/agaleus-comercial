server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Servir HTML siempre fresco (para que los cambios de campos aparezcan al instante)
  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Assets pueden cachearse 1h: si cambian, el HTML los referencia y el navegador re-pide
  location ~* \.(css|js|png|jpg|jpeg|svg|webmanifest|json)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
  }

  # Excluir deploy/ y CNAME del listado público
  location ~ ^/(deploy|\.git|CNAME) {
    deny all;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
