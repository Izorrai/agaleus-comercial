<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0e3540">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agaleus Comercial">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo_agaleus.png">
  <link rel="icon" href="logo_agaleus.png">
  <title>Agaleus &middot; Nuevo cliente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <img src="logo_agaleus.png" alt="Agaleus" class="logo">
    <h1>Nuevo cliente</h1>
    <p class="subtitle">Aceite usado &middot; País Vasco</p>
  </header>

  <main>
    <form id="lead-form" novalidate>
      <label class="field">
        <span class="label">Provincia</span>
        <select id="provincia" name="provincia" required>
          <option value="" disabled selected>Elige provincia…</option>
          <option value="Bizkaia">Bizkaia</option>
          <option value="Gipuzkoa">Gipuzkoa</option>
          <option value="Araba">Araba</option>
        </select>
      </label>

      <label class="field">
        <span class="label">Municipio</span>
        <select id="municipio" name="municipio" required disabled>
          <option value="" disabled selected>Elige primero la provincia</option>
        </select>
      </label>

      <label class="field">
        <span class="label">Empresa</span>
        <input type="text" id="empresa" name="empresa" autocomplete="organization" placeholder="Nombre de la empresa" required>
      </label>

      <label class="field">
        <span class="label">Persona de contacto</span>
        <input type="text" id="contacto" name="contacto" autocomplete="name" placeholder="Nombre y apellido" required>
      </label>

      <label class="field">
        <span class="label">Cantidad estimada de aceite</span>
        <div class="combo">
          <input type="number" id="cantidad" name="cantidad" inputmode="decimal" min="0" step="any" placeholder="Ej: 200" required>
          <select id="unidad" name="unidad">
            <option value="L" selected>litros</option>
            <option value="kg">kg</option>
            <option value="bidones">bidones</option>
          </select>
        </div>
      </label>

      <label class="field">
        <span class="label">Frecuencia de entrada en planta <span class="optional">(opcional)</span></span>
        <select id="frecuencia" name="frecuencia">
          <option value="" selected>Sin especificar</option>
          <option value="Semanal">Semanal</option>
          <option value="Quincenal">Quincenal</option>
          <option value="Mensual">Mensual</option>
          <option value="Bimestral">Bimestral</option>
          <option value="Trimestral">Trimestral</option>
          <option value="Semestral">Semestral</option>
          <option value="Anual">Anual</option>
          <option value="Puntual">Puntual</option>
        </select>
      </label>

      <label class="field">
        <span class="label">Urgencia</span>
        <select id="urgencia" name="urgencia" required>
          <option value="Normal" selected>Normal</option>
          <option value="Urgente">Urgente</option>
          <option value="Desbordado">Desbordado</option>
        </select>
      </label>

      <label class="field">
        <span class="label">Teléfono</span>
        <input type="tel" id="telefono" name="telefono" autocomplete="tel" inputmode="tel" placeholder="6XX XXX XXX" required>
      </label>

      <label class="field">
        <span class="label">Email <span class="optional">(opcional)</span></span>
        <input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="cliente@ejemplo.com">
      </label>

      <label class="field">
        <span class="label">Notas (opcional)</span>
        <textarea id="notas" name="notas" rows="3" placeholder="Detalles, horarios de acceso, etc."></textarea>
      </label>

      <button type="submit" id="submit-btn" class="btn-primary">
        <span class="btn-label">Enviar cliente</span>
        <span class="btn-loader" hidden></span>
      </button>
    </form>

    <div id="success" class="toast toast-ok" hidden>
      <strong>¡Enviado!</strong>
      <span>Cliente registrado correctamente.</span>
      <button type="button" id="new-btn" class="btn-secondary">Añadir otro</button>
    </div>

    <div id="error" class="toast toast-err" hidden>
      <strong>No se pudo enviar</strong>
      <span id="error-msg">Revisa la conexión e inténtalo de nuevo.</span>
      <button type="button" id="retry-btn" class="btn-secondary">Reintentar</button>
    </div>

    <section id="history" class="history">
      <header class="history-head">
        <h2>Pendientes <span id="history-count" class="history-count">(0)</span></h2>
        <button type="button" id="history-clear" class="history-clear" hidden>Vaciar</button>
      </header>
      <p id="history-empty" class="history-empty">No hay leads pendientes.</p>
      <ul id="history-list" class="history-list"></ul>
    </section>

    <section id="completed" class="history completed-section">
      <header class="history-head">
        <h2>Completados <span id="completed-count" class="history-count">(0)</span></h2>
        <button type="button" id="completed-toggle" class="history-clear">Mostrar</button>
      </header>
      <div id="completed-body" hidden>
        <p id="completed-empty" class="history-empty">Aún no hay leads completados.</p>
        <ul id="completed-list" class="history-list"></ul>
      </div>
    </section>
  </main>

  <footer>
    <small>&copy; Agaleus</small>
  </footer>

  <script src="municipios.js?v=2"></script>
  <script src="app.js"></script>
</body>
</html>
